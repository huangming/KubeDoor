<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=0"
    />
    <title data-id="title">花折 - KubeDoor</title>
    <link rel="icon" href="/18logo.png" />
    <script>
      window.process = {};
    </script>
    <!--
      必须写在模块之前。页面里的 xhook 会先拿走原生 XMLHttpRequest/fetch，
      之后再改 prototype 已经影响不到真正发出去的请求。
      页面在 /kubedoor/ 下时，接口、WebSocket 都要带上这个前缀，前置 nginx 才能转发。
    -->
    <script>
      (function () {
        var PREFIX = "/kubedoor";
        function currentPrefix() {
          var path = location.pathname || "";
          if (path === PREFIX || path.indexOf(PREFIX + "/") === 0) return PREFIX;
          return "";
        }
        function withPrefix(input) {
          var prefix = currentPrefix();
          if (!prefix || typeof input !== "string" || !input) return input;
          if (input.charAt(0) === "/" && input.charAt(1) !== "/") {
            var hashAt = input.indexOf("#");
            var before = hashAt >= 0 ? input.slice(0, hashAt) : input;
            var hash = hashAt >= 0 ? input.slice(hashAt) : "";
            var path = before.split("?")[0];
            if (path === prefix || path.indexOf(prefix + "/") === 0) return input;
            return prefix + before + hash;
          }
          if (/^(https?|wss?):\/\//i.test(input)) {
            try {
              var url = new URL(input);
              if (url.origin !== location.origin) return input;
              if (url.pathname === prefix || url.pathname.indexOf(prefix + "/") === 0) {
                return input;
              }
              url.pathname = prefix + url.pathname;
              return url.toString();
            } catch (e) {
              return input;
            }
          }
          return input;
        }
        var xhrOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function (method, url, async, username, password) {
          var next = typeof url === "string" ? withPrefix(url) : url;
          return xhrOpen.call(this, method, next, async !== false, username, password);
        };
        if (typeof window.fetch === "function") {
          var nativeFetch = window.fetch.bind(window);
          window.fetch = function (input, init) {
            if (typeof input === "string") return nativeFetch(withPrefix(input), init);
            if (typeof Request !== "undefined" && input instanceof Request) {
              var next = withPrefix(input.url);
              if (next !== input.url) input = new Request(next, input);
            }
            return nativeFetch(input, init);
          };
        }
        var NativeWebSocket = window.WebSocket;
        function PrefixedWebSocket(url, protocols) {
          var next = typeof url === "string" ? withPrefix(url) : url;
          if (protocols === undefined) return new NativeWebSocket(next);
          return new NativeWebSocket(next, protocols);
        }
        PrefixedWebSocket.prototype = NativeWebSocket.prototype;
        Object.setPrototypeOf(PrefixedWebSocket, NativeWebSocket);
        window.WebSocket = PrefixedWebSocket;
      })();
    </script>
  </head>

  <body>
    <div id="app">
      <style>
        html,
        body,
        #app {
          position: relative;
          display: flex;
          align-items: center;
          justify-content: center;
          width: 100%;
          height: 100%;
          overflow: hidden;
        }

        .loader,
        .loader::before,
        .loader::after {
          width: 2.5em;
          height: 2.5em;
          border-radius: 50%;
          animation: load-animation 1.8s infinite ease-in-out;
          animation-fill-mode: both;
        }

        .loader {
          position: relative;
          top: 0;
          margin: 80px auto;
          font-size: 10px;
          color: #406eeb;
          text-indent: -9999em;
          transform: translateZ(0);
          transform: translate(-50%, 0);
          animation-delay: -0.16s;
        }

        .loader::before,
        .loader::after {
          position: absolute;
          top: 0;
          content: "";
        }

        .loader::before {
          left: -3.5em;
          animation-delay: -0.32s;
        }

        .loader::after {
          left: 3.5em;
        }

        @keyframes load-animation {
          0%,
          80%,
          100% {
            box-shadow: 0 2.5em 0 -1.3em;
          }

          40% {
            box-shadow: 0 2.5em 0 0;
          }
        }
      </style>
      <div class="loader"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
